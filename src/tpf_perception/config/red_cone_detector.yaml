red_cone_detector_node:
  ros__parameters:
    # Topics in the Parte C rosbag. On the real robot, keep these names if the
    # lab TurtleBot publishes the same namespace, or override them in launch.
    image_topic: /tb4_0/oakd/rgb/preview/image_raw
    camera_info_topic: /tb4_0/oakd/rgb/preview/camera_info
    pose_topic: /pose_estimate

    detections_topic: /red_cone/detections
    debug_image_topic: /red_cone/debug_image
    mask_image_topic: /red_cone/mask
    markers_topic: /red_cone/markers
    goal_topic: /goal_pose

    # TurtleBot 0 intrinsics from the provided calibration notes.
    use_static_calibration: true
    camera_matrix: [203.14, 0.0, 122.57, 0.0, 361.13, 123.33, 0.0, 0.0, 1.0]

    # Tune this to the physical cones used in the lab.
    cone_height_m: 0.30
    goal_standoff_m: 0.35
    camera_x_offset_m: 0.05
    camera_y_offset_m: 0.0
    camera_yaw_offset_rad: 0.0

    # Color/geometry gates. HSV red is split around hue=0; the first band is
    # intentionally wide enough to catch orange-red lab cones.
    hue_low_1: 0
    hue_high_1: 28
    hue_low_2: 155
    hue_high_2: 179
    sat_low: 60
    value_low: 35
    min_area_px: 120.0
    min_height_px: 16
    min_fill_ratio: 0.22
    max_fill_ratio: 0.92
    min_aspect_ratio: 0.25
    max_aspect_ratio: 1.35
    min_triangularity: 0.38
    min_range_m: 0.20
    max_range_m: 4.0

    # Temporal validation to reject red distractors/noisy frames.
    history_size: 8
    confirmations_required: 4
    stable_radius_m: 0.35
    republish_period_s: 5.0

    auto_publish_goal: true
    publish_debug_image: true
