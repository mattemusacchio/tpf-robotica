# Parte C — validacion sobre el RosBag real (laberinto_conos).
# Difiere de navigation_params.yaml (que es para Gazebo/Parte B) en lo que el bag
# real necesita: topicos /tb4_0/*, y la transformada del laser a yaw=pi/2
# (el TB4 real tiene el LiDAR rotado 90 grados, igual que en el mapeo de Parte A).
/**:
  ros__parameters:
    use_sim_time: true

mcl_localizer:
  ros__parameters:
    num_particles: 2500
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.08
    alpha4: 0.08
    lidar_sigma_m: 0.20
    lidar_ray_stride: 6
    z_rand: 0.20
    lidar_max_range_m: 3.5
    lidar_weight: 1.0
    laser_x_m: -0.04
    laser_y_m: 0.0
    laser_yaw_rad: 1.5707963267948966
    lm_sigma_range: 0.15
    lm_sigma_bearing: 0.10
    lm_weight: 2.0
    publish_rate_hz: 20.0
    lost_var_thresh: 2.0
    scan_topic: /tb4_0/scan
    odom_topic: /tb4_0/odom
    init_x_m: -0.34
    init_y_m: 1.19
    init_pos_std_m: 0.30

astar_planner:
  ros__parameters:
    inflation_radius_m: 0.28
    robot_radius_m: 0.13
    dyn_inflation_radius_m: 0.22
    turn_weight: 1.0
    smooth_window: 9
    scan_topic: /tb4_0/scan
    laser_x_m: -0.04
    laser_yaw_rad: 1.5707963267948966
    dyn_replan_hz: 1.0
