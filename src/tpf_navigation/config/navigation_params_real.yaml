# Parte C — ROBOT REAL (sesion de laboratorio).
#
# Fuente de verdad de parametros para el robot fisico. El override por dict del
# launch NO siempre pisa al yaml namespaceado, asi que CAMBIAR ACA si hace falta:
#   - scan_topic / odom_topic / image_topic  -> nombres reales (ver `ros2 topic list`)
#   - laser_yaw_rad / laser_x_m              -> montaje del LiDAR del robot real
#
# Diferencias vs Gazebo (navigation_params.yaml):
#   - use_sim_time: false  (reloj real, no /clock)
#   - laser_yaw_rad: pi/2  (el TB4 real tiene el LiDAR rotado 90 grados)
#   - alpha1..4 mas altos  (absorben el deslizamiento mecanico real -> consigna 1.5)
/**:
  ros__parameters:
    use_sim_time: false

mcl_localizer:
  ros__parameters:
    num_particles: 2500
    # Ruido del modelo de movimiento: subido para tolerar patinaje de ruedas real.
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.10
    alpha4: 0.10
    lidar_sigma_m: 0.20
    lidar_ray_stride: 6
    z_rand: 0.20
    lidar_max_range_m: 3.5
    lidar_weight: 1.0
    laser_x_m: -0.04
    laser_y_m: 0.0
    laser_yaw_rad: 1.5707963267948966   # VERIFICAR en el lab mirando /scan vs paredes
    lm_sigma_range: 0.15
    lm_sigma_bearing: 0.10
    lm_weight: 2.0
    publish_rate_hz: 20.0
    lost_var_thresh: 2.0
    scan_topic: /tb4_0/scan             # CONFIRMAR nombre real
    odom_topic: /tb4_0/odom             # CONFIRMAR nombre real
    # Semilla inicial: igual se fija a mano con "2D Pose Estimate" en RViz.
    init_x_m: -0.34
    init_y_m: 1.19
    init_pos_std_m: 0.50

astar_planner:
  ros__parameters:
    inflation_radius_m: 0.28
    robot_radius_m: 0.13
    dyn_inflation_radius_m: 0.22
    turn_weight: 1.0
    smooth_window: 9
    scan_topic: /tb4_0/scan             # CONFIRMAR nombre real
    laser_x_m: -0.04
    laser_yaw_rad: 1.5707963267948966
    dyn_replan_hz: 1.0

pure_pursuit:
  ros__parameters:
    lookahead_m: 0.40
    rotate_threshold_rad: 0.698
    v_max: 0.18                         # un poco mas lento para el robot real
    omega_max: 0.80
    omega_align_max: 0.50
    tolerance_m: 0.15
    align_tolerance_rad: 0.087
    align_kp: 1.2
    v_ramp_start_m: 0.60
    control_rate_hz: 20.0

navigation_sm:
  ros__parameters:
    obstacle_confirm_hits: 2
    obstacle_range_m: 1.0
    obstacle_stop_range_m: 0.7
    obstacle_decay_s: 3.0
    localizing_timeout_s: 60.0
    planning_timeout_s: 5.0
    localized_cov_thresh: 1.0
    scan_topic: /tb4_0/scan             # remapeado por robot:=tb4_1 si corresponde
    laser_x_m: -0.04
    laser_y_m: 0.0
    laser_yaw_rad: 1.5707963267948966
